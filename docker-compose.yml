# One service. v2 needed two containers -- this one and a Rust Rocket server --
# because the webhook front end lived in WebMoMMI; it's folded in now.
services:
  mommi:
    build: .
    container_name: mommi
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "1679:1679"      # commloop, from the game server
      - "40000:40000"    # HTTP: GitHub webhooks and BYOND nudges
    # If the game server runs on this same host and talks to 127.0.0.1, swap the
    # ports block above for:
    #   network_mode: host
    #
    # DM code execution (if a server enables it) runs under BYOND -safe + a
    # #include reject + nice/prlimit caps, inside the container's own namespaces.
    # Do NOT set `sandbox = "bwrap"` in modules.toml here: bwrap needs privileges
    # that only --privileged grants (which would defeat the container), and the
    # bot fails DM closed if it's set but can't run. In a container the container
    # IS the sandbox -- host files and host-localhost are already unreachable.
    # The only thing bwrap would add is blocking world.Export() to EXTERNAL hosts;
    # if that matters (e.g. a cloud metadata endpoint), put this service on a
    # network that can't reach it, or run the bot on bare metal where bwrap works.
